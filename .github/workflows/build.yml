name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # build.bat finds a compiler by itself: it scans Program Files for any
      # Visual Studio edition and falls back to the csc.exe that ships with
      # .NET Framework (the sources are C# 5 compatible), then prints which
      # compiler it used.
      - name: Build
        shell: cmd
        run: build.bat q

      - name: Core self-test (43 checks)
        shell: cmd
        run: bin\KeywordClassifier.exe --selftest

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: KeywordClassifier-win
          path: bin/KeywordClassifier.exe
          if-no-files-found: error
